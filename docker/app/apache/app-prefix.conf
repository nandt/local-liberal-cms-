# The Drupal docroot answers on TWO URL bases.
#
# DocumentRoot is /var/www/html/__APP_PREFIX__ (the symlink to /opt/drupal/web the
# Dockerfile creates), so the site is served at "/" — that is what makes the AMP
# variant of an article reachable as /<section>/<slug>?amp, with Drupal deriving a
# "/" base path from SCRIPT_NAME and emitting unprefixed links and canonical.
#
# This Alias adds the historical /__APP_PREFIX__ base on top, mapping to the very
# same directory. Both bases share one .htaccess, which is why the rewrite rules
# there carry the prefix in an absolute substitution instead of a RewriteBase.
#
# Keeping DocumentRoot on the symlink rather than on /var/www/html also keeps
# /var/www/html/oauth-keys (the simple_oauth signing keys, mounted from a Secret)
# OUT of the docroot. With the docroot one level up, /oauth-keys/private.key is a
# readable static file.
Alias /__APP_PREFIX__ /var/www/html/__APP_PREFIX__
