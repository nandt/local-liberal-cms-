sonar.projectKey=Liberal-CMS
sonar.sources=.

# PHP file suffixes to be analyzed
sonar.php.file.suffixes=php,module,install,theme,inc

# Exclude vendored/generated code and third-party AMP test fixtures.
# lullabot-amp ships intentionally-malformed HTML/CSS that crashes the SonarJS bridge.
sonar.exclusions=**/node_modules/**,**/vendor/**,src/custom_packages/lullabot-amp/tests/test-data/**
